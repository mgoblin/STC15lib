compilers:
  - description: SDCC for STC15 (MCS51)
    match-compiler-exe: "(.*/)?sdcc(.exe)?"
    match-args: -mmcs51
    match-language: C
    # Эти переменные автоматически подставят путь к папке, где лежит sdcc.exe
    include-dirs:
      - ${compiler-exe-dir}/../share/sdcc/include/mcs51
      - ${compiler-exe-dir}/../share/sdcc/include
      - ${compiler-exe-dir}/../share/sdcc/non-free/include
      - ${project-path}/include
    defines-text: "
    #define __SDCC 1
    #define __mcs51 1
    #define __interrupt(vector)
    #define __using(regnum)
    #define __code
    #define __at(addr)
    #define __sfr
    #define __sfr16
    #define __sfr32
    #define __sbit
    #define __xdata
    "