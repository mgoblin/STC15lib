
compilers:

  - description: SDCC 4.5.0 STC15 Small Memory model
    match-sources: ".*\\.c"
    match-language: C
    match-compiler-exe: "(.*/)?sdcc(\\.exe)?"
    include-dirs:
      - ${project-path}/include
    defines-text: "
#define __interrupt(n)
#define __at(n)
#define __naked
#define __critical
#define __trap
"