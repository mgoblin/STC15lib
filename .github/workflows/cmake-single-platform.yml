name: CMake build release

on:
  push:
    tags:
      - 'v*'
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sdcc and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc graphviz doxygen

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

      - name: Package distribution
        working-directory: ${{github.workspace}}
        run: |  
          mkdir -p ${{github.workspace}}/dist/include
          mkdir -p ${{github.workspace}}/dist/lib
          find build/src -name '*.lib' -exec cp {} dist/lib \;
          cp include/*.h dist/include
          cd dist && zip -r ../STC15lib-${{ github.ref_name }}.zip .